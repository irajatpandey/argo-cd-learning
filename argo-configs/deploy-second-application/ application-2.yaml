apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app
  namespace: argo-cd
spec:
  project: default
  source:
    repoURL: https://github.com/irajatpandey/argo-cd-learning.git
    targetRevision: HEAD
    path: my-helm-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


      