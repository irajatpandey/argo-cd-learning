apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sync-waves-app
  namespace: argo-cd
spec:
  project: my-project
  source:
    repoURL: https://github.com/irajatpandey/argo-cd-learning.git
    targetRevision: HEAD
    path: sync-waves-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
