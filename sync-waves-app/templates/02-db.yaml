apiVersion: apps/v1
kind: Deployment
metadata:
  name: sync-waves-db
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: sync-waves-app
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.db.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: sync-waves-app
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sync-waves-app
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: redis
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: redis
          envFrom:
            - configMapRef:
                name: sync-waves-config
---
apiVersion: v1
kind: Service
metadata:
  name: sync-waves-db-svc
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: sync-waves-app
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: sync-waves-app
    app.kubernetes.io/component: database
