apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: my-helm-applicationset
  namespace: argo-cd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: dev
          - env: prod
            namespace: prod
  template:
    metadata:
      name: '{{env}}-my-helm-app'
    spec:
      project: default
      source:
        # Replace with your GitHub Repository URL
        repoURL: https://github.com/YOUR_GITHUB_USERNAME/argo-cd-learning.git
        targetRevision: HEAD
        path: my-helm-app
        helm:
          valueFiles:
            - values.yaml
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
