apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-helm-app
  namespace: argo-cd
spec:
  project: default
  source:
    # Replace with your GitHub Repository URL
    repoURL: https://github.com/YOUR_GITHUB_USERNAME/argo-cd-learning.git
    targetRevision: HEAD
    path: my-helm-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
